<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核对程序 - 工程审计智能审读</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/pc/css/pc-layout.css">
<link rel="stylesheet" href="/pc/css/pc-components.css">
<link rel="stylesheet" href="/pc/css/pc-audit.css">
<link rel="stylesheet" href="/pc/css/pc-visual-enhance.css">
</head>
<body>
<div class="pc-wrapper">
  <aside class="pc-sidebar" id="pcSidebar"></aside>
  <div class="pc-main">
    <header class="pc-topbar" id="pcTopbar"></header>
    <main class="pc-content">

      <div id="noProject" style="display:none;">
        <div class="au-empty"><span class="icon">📁</span>请选择审计项目，或先从「审计项目」进入</div>
        <div class="pc-card" style="max-width:420px;margin:16px auto;">
          <div class="pc-card-title">选择审计项目</div>
          <select class="au-select" id="projectPick" style="width:100%;"></select>
        </div>
      </div>

      <div id="projectView" style="display:none;">
        <div class="au-project-bar">
          <button class="au-btn sm" onclick="location.href='/pc/audit-project.html'">‹ 返回项目</button>
          <div class="au-ctx">
            <select class="au-ctx-select" id="ctxSwitch"></select>
            <div class="au-ctx-meta" id="ctxMeta"></div>
          </div>
          <button class="au-btn primary" id="btnRunBoq" style="margin-left:auto;">▶ 清单↔结算勾稽</button>
          <button class="au-btn primary" id="btnRunVisa">▶ 三方签章核对</button>
        </div>

        <div class="pc-card" style="margin-bottom:16px;">
          <div class="pc-card-title">核对记录
            <select class="au-select sm" id="progSelect" style="width:auto;margin-left:auto;"></select>
          </div>
          <div class="pc-card-title">📊 核对概览 <span id="progMeta" style="font-size:12px;color:#94a3b8;font-weight:400;"></span></div>
          <div id="summaryCards" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
          <div style="margin-top:12px;font-size:12.5px;color:#64748b;line-height:1.8;" id="summaryNote"></div>
        </div>

        <div class="pc-card">
          <div class="pc-card-title">
            逐项核对明细
            <select class="au-select sm" id="filterConcl" style="width:auto;margin-left:auto;">
              <option value="all">全部</option>
              <option value="diff">仅差异/缺失</option>
              <option value="match">仅一致</option>
              <option value="unconfirmed">仅无法确认</option>
            </select>
          </div>
          <div style="overflow-x:auto;">
            <table class="au-table">
              <thead>
                <tr>
                  <th>清单编码</th><th>项目名称</th><th>单位</th>
                  <th>工程量(左/右)</th><th>综合单价(左/右)</th><th>合价(左/右)</th>
                  <th>结论</th><th>差异说明</th><th>审计建议</th><th>证据</th>
                </tr>
              </thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>
          <div id="itemEmpty" class="au-empty" style="display:none;"><span class="icon">🔍</span>尚未运行核对</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/pc/js/pc-common.js"></script>
<script src="/pc/js/pc-audit-checks.js"></script>
<script>initPCCommon('audit-checks');</script>
</body>
</html>
